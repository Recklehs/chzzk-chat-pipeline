<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f0e8;
            --panel: #fffaf1;
            --ink: #202020;
            --muted: #6b645a;
            --accent: #c24d2c;
            --accent-dark: #8d341c;
            --border: #ddcfbe;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at top left, rgba(194, 77, 44, 0.16), transparent 34%),
                linear-gradient(145deg, #efe3d1, var(--bg));
            color: var(--ink);
            font-family: "Avenir Next", "SUIT", sans-serif;
        }
        .card {
            width: min(92vw, 420px);
            padding: 32px;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: rgba(255, 250, 241, 0.96);
            box-shadow: 0 24px 60px rgba(74, 48, 16, 0.12);
        }
        h1 {
            margin: 0 0 8px;
            font-size: 1.9rem;
        }
        p {
            margin: 0 0 20px;
            color: var(--muted);
            line-height: 1.5;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.95rem;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: #fff;
            font-size: 1rem;
        }
        button {
            width: 100%;
            margin-top: 14px;
            padding: 14px 16px;
            border: 0;
            border-radius: 14px;
            background: var(--accent);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }
        button:hover { background: var(--accent-dark); }
        .error {
            min-height: 1.4rem;
            margin-top: 12px;
            color: #b42318;
            font-size: 0.92rem;
        }
    </style>
</head>
<body>
<main class="card">
    <h1>CHZZK Monitoring Dashboard</h1>
    <p>대시보드에 접근하려면 현재 서버의 `API_KEY`를 입력하세요.</p>
    <form id="login-form">
        <label for="api_key">API Key</label>
        <input id="api_key" name="api_key" type="password" autocomplete="current-password" required>
        <button type="submit">로그인</button>
        <div class="error" id="login-error"></div>
    </form>
</main>
<script>
    const form = document.getElementById("login-form");
    const errorBox = document.getElementById("login-error");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorBox.textContent = "";

        const formData = new FormData(form);
        const response = await fetch("/dashboard/session", {
            method: "POST",
            body: formData,
        });

        if (!response.ok) {
            const payload = await response.json().catch(() => ({ detail: "로그인에 실패했습니다." }));
            errorBox.textContent = payload.detail || "로그인에 실패했습니다.";
            return;
        }

        window.location.reload();
    });
</script>
</body>
</html>
