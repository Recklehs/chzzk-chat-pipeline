services:
  kafka:
    environment:
      KAFKA_JMX_PORT: "9999"
      KAFKA_JMX_HOSTNAME: "kafka"
      KAFKA_JMX_OPTS: "-Dcom.sun.management.jmxremote=true -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Dcom.sun.management.jmxremote.local.only=false -Dcom.sun.management.jmxremote.port=9999 -Dcom.sun.management.jmxremote.rmi.port=9999 -Djava.rmi.server.hostname=kafka"
    expose:
      - "9999"

  benchmark-topic-init:
    image: apache/kafka:4.2.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - BENCHMARK_RUN_ID=${BENCHMARK_RUN_ID:-local}
      - BENCHMARK_TOPIC_PREFIX=chzzk.events.raw.benchmark
    command: >
      sh -lc "/opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:29092
      --create
      --if-not-exists
      --topic $${BENCHMARK_TOPIC_PREFIX}.$${BENCHMARK_RUN_ID}
      --partitions 1
      --replication-factor 1"

  collector-bench:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      benchmark-topic-init:
        condition: service_completed_successfully
    env_file:
      - ./benchmark.env
    environment:
      - APP_ENV=test
      - EVENT_BUS_BACKEND=kafka
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - METRICS_ENABLED=true
      - BENCHMARK_RUN_ID=${BENCHMARK_RUN_ID:-local}
      - BENCHMARK_INPUT=${BENCHMARK_INPUT:-/app/tests/fixtures/replay/steady-chat.ndjson}
      - BENCHMARK_OUTPUT=${BENCHMARK_OUTPUT:-/app/data/output/benchmarks/results/summary-${BENCHMARK_RUN_ID:-local}.json}
      - BENCHMARK_WARMUP_SECONDS=${BENCHMARK_WARMUP_SECONDS:-0}
      - BENCHMARK_DURATION_SECONDS=${BENCHMARK_DURATION_SECONDS:-}
      - BENCHMARK_LOOP_INPUT=${BENCHMARK_LOOP_INPUT:-false}
      - BENCHMARK_METRICS_LINGER_SECONDS=${BENCHMARK_METRICS_LINGER_SECONDS:-30}
    command: >
      sh -lc "python -m collector.benchmark_replay
      --input $${BENCHMARK_INPUT}
      --output $${BENCHMARK_OUTPUT}
      --run-id $${BENCHMARK_RUN_ID}
      --warmup-seconds $${BENCHMARK_WARMUP_SECONDS}
      $$(test -n \"$${BENCHMARK_DURATION_SECONDS}\" && printf '%s' \"--duration-seconds $${BENCHMARK_DURATION_SECONDS}\")
      $$(test \"$${BENCHMARK_LOOP_INPUT}\" = \"true\" && printf '%s' \"--loop-input\")
      --metrics-linger-seconds $${BENCHMARK_METRICS_LINGER_SECONDS}"
    volumes:
      - ./benchmark.env:/app/.env.test:ro
      - ../data/output/benchmarks:/app/data/output/benchmarks
    cpus: "1.0"
    mem_limit: "4g"

  prometheus:
    image: prom/prometheus:v3.0.1
    depends_on:
      - collector-bench
      - cadvisor
      - kafka-jmx-exporter
    ports:
      - "19090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.4.0
    depends_on:
      - prometheus
    ports:
      - "13000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: benchmark

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    ports:
      - "18081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  kafka-jmx-exporter:
    image: bitnami/jmx-exporter@sha256:672e315e0f34b3d35bfc28e74bf7296a22883843d2d7773d53bae5385981ab06
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - "9404"
      - "/etc/jmx-exporter/kafka-jmx.yml"
    ports:
      - "19404:9404"
    volumes:
      - ./observability/kafka-jmx.yml:/etc/jmx-exporter/kafka-jmx.yml:ro
