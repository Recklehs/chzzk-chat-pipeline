# Spark runtime
spark.app.name=Kafka Raw to Bronze
spark.master=local[*]
spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.databricks.delta.autoCompact.enabled=true
spark.databricks.delta.optimizeWrite.enabled=true
spark.jars.packages=io.delta:delta-spark_2.13:4.0.1,org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.1

# App runtime
app.kafka.bootstrap.servers=localhost:9092
app.kafka.topic=chzzk.events.raw
app.kafka.startingOffsets=earliest
# Derived sibling output directories:
# <base>/bronze
# <base>/dead_letter (legacy setting; not written by the frame Bronze job)
# <base>/checkpoint
# Local filesystem path, relative to the repository root. No GCS/ADC required.
app.bucket.uri=data/output/local/frames
