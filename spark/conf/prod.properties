# Spark runtime
spark.app.name=Kafka Raw to Bronze
spark.master=local[*]
spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.databricks.delta.autoCompact.enabled=true
spark.databricks.delta.optimizeWrite.enabled=true
spark.hadoop.fs.gs.impl=com.google.cloud.hadoop.fs.gcs.GoogleHadoopFileSystem
spark.hadoop.fs.AbstractFileSystem.gs.impl=com.google.cloud.hadoop.fs.gcs.GoogleHadoopFS
spark.hadoop.fs.gs.auth.type=APPLICATION_DEFAULT
spark.jars.packages=com.google.cloud.bigdataoss:gcs-connector:4.0.1:shaded,io.delta:delta-spark_2.13:4.0.1

# App runtime
app.kafka.bootstrap.servers=localhost:9092
app.kafka.topic=chzzk.events.raw
app.kafka.startingOffsets=latest
# Derived sibling output directories:
# <base>/bronze
# <base>/dead_letter
# <base>/checkpoint
app.bucket.uri=gs://your-bucket/chzzk/prod
